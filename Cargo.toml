[package]
name = "navidrome-delete"
version = "0.1.0"
edition = "2021"
description = "Delete music files from Navidrome by adding them to a dedicated playlist."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
nd-pdk = { path = ".deps/navidrome/plugins/pdk/rust/nd-pdk" }
extism-pdk = "1.2"
serde_json = "1.0"
urlencoding = "2.1"
